name: Fork implementation validation

on:
  push:
    branches: [ci/validate-mf-vite]

permissions:
  contents: read

concurrency:
  group: fork-implementation-validation
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.target.name }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        target:
          - name: ssr-cjs-companion
            ref: 6f865cc
            integration: integration/ssr-cjs.test.ts integration/ssr-entry-loader-build.test.ts
            gc: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ matrix.target.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Package build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Source formatting
        if: ${{ !cancelled() }}
        run: pnpm fmt.check
      - name: Feature integration tests
        if: ${{ !cancelled() && matrix.target.integration != '' }}
        run: pnpm exec vitest run ${{ matrix.target.integration }}
      - name: Owned graph garbage collection regressions
        if: ${{ !cancelled() && matrix.target.gc }}
        run: pnpm exec vitest run src/utils/__tests__/ssrBuildGraph.test.ts src/utils/__tests__/ssrEntryLoader.build-graph-cache.test.ts src/utils/__tests__/ssrEntryLoader.build-lifecycle.test.ts --execArgv=--expose-gc --execArgv=--experimental-vm-modules
  compatibility:
    name: CJS companion / Vite ${{ matrix.vite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite: ['5.4.21', '6.4.6', '7.3.8', '8.2.4']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: 6f865cc
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Match upstream's peer-version testing; only the disposable runner changes its lockfile.
      - run: pnpm add -Dw vite-under-test@npm:vite@${{ matrix.vite }}
      - run: pnpm build
      - name: CJS and existing SSR build compatibility
        env:
          MFE_VITE_PACKAGE: vite-under-test
        run: pnpm exec vitest run integration/ssr-cjs.test.ts integration/ssr-entry-loader-build.test.ts

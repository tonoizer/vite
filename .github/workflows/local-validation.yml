name: Fork implementation validation

on:
  push:
    branches: [ci/validate-mf-vite]

permissions:
  contents: read

concurrency:
  group: fork-implementation-validation
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.target.name }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        target:
          - name: preload-asset
            ref: 1c68610e44d0e3ec2df2471fbc32da260cc6cc29
            integration: integration/host-build.test.ts
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ matrix.target.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.28.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Package build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Source formatting
        if: ${{ !cancelled() }}
        run: pnpm fmt.check
      - name: Feature integration tests
        if: ${{ !cancelled() && matrix.target.integration != '' }}
        run: pnpm exec vitest run ${{ matrix.target.integration }}
